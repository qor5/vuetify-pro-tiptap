name: Test

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  tests:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [20]
        # pnpm: [8]

    steps:
      - uses: actions/checkout@v4
        with:
          # Nothing here pushes, tags or opens a PR, so the token checkout writes
          # into .git/config by default is only an extra thing for a later step --
          # or a dependency's install script -- to find.
          persist-credentials: false

      - uses: ./.github/actions/build-setup
        with:
          node-version: ${{ matrix.node }}

      - name: Test
        run: pnpm lint:css && pnpm lint:js && pnpm check:types
